<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<!--
    Shared page parts for the Santa Claude app.
    Usage: <head th:replace="~{fragments/layout :: head('Dine ønskesedler')}"></head>
-->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="|${title} – Santa Claude|">Santa Claude</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
    <script src="/js/htmx.min.js" th:src="@{/js/htmx.min.js}" defer></script>
</head>

<body>

<!-- Stars and falling snow behind the night sky. Put it first inside an element with class "sky". -->
<svg th:fragment="sky-decor" class="sky-decor" aria-hidden="true">
    <g class="stars">
        <circle cx="6%" cy="14%" r="1.6"/><circle cx="18%" cy="34%" r="1.2"/><circle cx="31%" cy="10%" r="1.6"/>
        <circle cx="44%" cy="28%" r="1.2"/><circle cx="58%" cy="12%" r="1.6"/><circle cx="71%" cy="36%" r="1.2"/>
        <circle cx="84%" cy="16%" r="1.6"/><circle cx="94%" cy="42%" r="1.2"/><circle cx="12%" cy="58%" r="1.2"/>
        <circle cx="64%" cy="56%" r="1.2"/>
    </g>
    <g class="snowfall">
        <circle class="flake" cx="4%" cy="0" r="2.5"/><circle class="flake" cx="14%" cy="0" r="1.8"/>
        <circle class="flake" cx="25%" cy="0" r="2.5"/><circle class="flake" cx="37%" cy="0" r="1.8"/>
        <circle class="flake" cx="49%" cy="0" r="2.5"/><circle class="flake" cx="61%" cy="0" r="1.8"/>
        <circle class="flake" cx="72%" cy="0" r="2.5"/><circle class="flake" cx="83%" cy="0" r="1.8"/>
        <circle class="flake" cx="93%" cy="0" r="2.5"/><circle class="flake" cx="42%" cy="0" r="1.8"/>
    </g>
</svg>

<!-- Snowy ground at the bottom of the sky: the same curve as the error pages. size: 'normal' or 'tall' -->
<svg th:fragment="ground(size)" class="ground" th:classappend="${size == 'tall'} ? 'ground-tall'" viewBox="0 312 800 88" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 330 Q200 312 400 330 T800 328 V400 H0 Z"/>
</svg>

<!-- Logo: Santa's hat + name -->
<a th:fragment="brand(href)" class="brand" href="/" th:href="${href}">
    <svg width="30" height="26" viewBox="300 138 90 44" aria-hidden="true">
        <path class="hat-red" d="M307 176 Q318 140 350 142 Q372 146 380 170 L372 176 Z"/>
        <circle class="hat-trim" cx="381" cy="172" r="7"/>
        <rect class="hat-trim" x="303" y="168" width="56" height="11" rx="5.5"/>
    </svg>
    Santa Claude
</a>

<!-- Top bar for logged-in pages -->
<header th:fragment="topbar" class="topbar">
    <div class="container topbar-inner">
        <a th:replace="~{fragments/layout :: brand(@{/letters})}"></a>
        <nav class="account" aria-label="Konto">
            <span class="avatar avatar-small" aria-hidden="true"
                  th:text="${session.userName != null ? session.userName.substring(0, 1).toUpperCase() : ''}">P</span>
            <form method="post" action="/logout" th:action="@{/logout}">
                <button class="account-link" type="submit">Log ud</button>
            </form>
        </nav>
    </div>
</header>

<!-- Reindeer standing on the snow, looking right (wishlist page) -->
<svg th:fragment="deer-right" class="deer deer-right" viewBox="120 180 140 160" width="112" height="128" aria-hidden="true">
    <g transform="translate(176 330)">
        <g class="bob">
            <ellipse class="fur" cx="0" cy="-50" rx="40" ry="20"/>
            <ellipse class="fur-light" cx="-40" cy="-56" rx="7" ry="5"/>
            <g class="legs">
                <line x1="-28" y1="-38" x2="-28" y2="-4"/><line x1="-16" y1="-36" x2="-16" y2="-4"/>
                <line x1="16" y1="-36" x2="16" y2="-4"/><line x1="28" y1="-38" x2="28" y2="-4"/>
            </g>
            <path class="fur" d="M26 -62 L44 -96 L56 -92 L38 -52 Z"/>
            <ellipse class="fur" cx="54" cy="-102" rx="16" ry="11"/>
            <ellipse class="fur-light" cx="67" cy="-99" rx="8" ry="6"/>
            <circle class="nose-red" cx="74" cy="-100" r="4"/>
            <circle class="eye" cx="51" cy="-106" r="2"/>
            <ellipse class="fur" cx="42" cy="-111" rx="8" ry="3"/>
            <path class="antler" d="M48 -112 L40 -136 M43 -126 L33 -132 M57 -113 L63 -138 M61 -128 L70 -133"/>
        </g>
    </g>
</svg>

<!-- Reindeer with its nose in the snow (letters page) -->
<svg th:fragment="deer-left" class="deer deer-left" viewBox="0 190 130 150" width="98" height="113" aria-hidden="true">
    <g transform="translate(86 330) scale(-1 1)">
        <g class="sniff">
            <ellipse class="fur" cx="0" cy="-50" rx="40" ry="20"/>
            <ellipse class="fur-light" cx="-40" cy="-56" rx="7" ry="5"/>
            <g class="legs">
                <line x1="-28" y1="-38" x2="-28" y2="-4"/><line x1="-16" y1="-36" x2="-16" y2="-4"/>
                <line x1="16" y1="-36" x2="16" y2="-4"/><line x1="28" y1="-38" x2="28" y2="-4"/>
            </g>
            <path class="fur" d="M26 -62 L48 -86 L58 -80 L38 -52 Z"/>
            <ellipse class="fur" cx="58" cy="-90" rx="16" ry="11"/>
            <ellipse class="fur-light" cx="71" cy="-87" rx="8" ry="6"/>
            <circle class="nose" cx="78" cy="-88" r="3.5"/>
            <circle class="eye" cx="55" cy="-94" r="2"/>
            <ellipse class="fur" cx="46" cy="-99" rx="8" ry="3"/>
            <path class="antler" d="M52 -100 L44 -124 M47 -114 L37 -120 M61 -101 L67 -126 M65 -116 L74 -121"/>
        </g>
    </g>
</svg>

<!-- Close (X) icon used in modals -->
<svg th:fragment="icon-close" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <path d="M6 6l12 12M18 6 6 18"/>
</svg>

<!-- Plus icon -->
<svg th:fragment="icon-plus" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
    <path d="M12 5v14M5 12h14"/>
</svg>

<!--
    Confirmation after something was saved ("Ønsket er tilføjet").
    Usage: <th:block th:if="${flash}"><p th:replace="~{fragments/layout :: flash(${flash})}"></p></th:block>
    In the controller: redirectAttributes.addFlashAttribute("flash", "...") before the redirect.
-->
<p th:fragment="flash(message)" class="flash" role="status">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12.5l4.5 4.5L19 7.5"/>
    </svg>
    <span th:text="${message}">Gemt.</span>
</p>

<!-- Santa sitting on the top edge of a card, waving, with his sack (login and create-account pages) -->
<svg th:fragment="santa-sitting" class="login-santa" viewBox="250 128 190 212" role="img" aria-label="Julemanden sidder på formularen og vinker">
    <path class="sack" d="M378 310 Q378 276 404 272 Q430 276 432 310 Z"/>
    <path class="sack-top" d="M398 274 q6 -8 12 0 Z"/>
    <path class="patch" d="M400 290 l10 0 l0 8 l-10 0 Z"/>
    <g class="sway">
        <rect class="suit" x="307" y="294" width="15" height="30"/>
        <rect class="suit" x="338" y="294" width="15" height="30"/>
        <rect class="boot" x="302" y="318" width="22" height="16" rx="5"/>
        <rect class="boot" x="336" y="318" width="22" height="16" rx="5"/>
        <ellipse class="suit" cx="330" cy="270" rx="42" ry="40"/>
        <rect class="trim" x="290" y="294" width="80" height="9" rx="4.5"/>
        <rect class="belt" x="289" y="272" width="82" height="10"/>
        <rect class="buckle" x="322" y="269" width="16" height="16" rx="2"/>
        <path class="sleeve" d="M296 252 Q282 272 300 292"/>
        <circle class="mitten" cx="301" cy="293" r="8"/>
        <g class="wave">
            <path class="sleeve" d="M364 250 Q392 240 396 214"/>
            <ellipse class="mitten" cx="398" cy="206" rx="9" ry="11"/>
            <ellipse class="mitten" cx="407" cy="210" rx="3.5" ry="6"/>
        </g>
        <g transform="translate(0 10)">
            <circle class="skin" cx="330" cy="194" r="24"/>
            <path class="beard" d="M305 196 Q304 250 330 256 Q356 250 355 196 Q342 210 330 208 Q318 210 305 196 Z"/>
            <path class="happy-eyes" d="M317 191 q4 -4 8 0 M335 191 q4 -4 8 0"/>
            <path class="brow" d="M313 181 Q320 176 327 180 M333 180 Q340 176 347 181"/>
            <path class="mouth" d="M323 214 q7 8 14 0 Z"/>
            <ellipse class="beard" cx="322" cy="207" rx="9" ry="5"/>
            <ellipse class="beard" cx="338" cy="207" rx="9" ry="5"/>
            <circle class="cheek" cx="330" cy="201" r="4"/>
            <path class="suit" d="M307 176 Q318 140 350 142 Q372 146 380 170 L372 176 Z"/>
            <circle class="trim" cx="381" cy="172" r="7"/>
            <rect class="trim" x="303" y="168" width="56" height="11" rx="5.5"/>
        </g>
    </g>
</svg>

<footer th:fragment="footer" class="site-footer">
    <div class="container site-footer-inner">
        <span>Santa Claude · tjekket to gange</span>
        <span>wishlist-group9</span>
    </div>
</footer>

</body>
</html>
