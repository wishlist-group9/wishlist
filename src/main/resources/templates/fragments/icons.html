<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<!--
    Category icons for wishes. The colour comes from the surrounding .tile-<category> class.
    Usage: <svg th:replace="~{fragments/icons :: category(${wish.category})}"></svg>
    Categories: tech, book, wear, home, play
-->
<body>

<svg th:fragment="category(category)" class="cat-icon" viewBox="0 0 24 24" aria-hidden="true" th:switch="${category}">
    <th:block th:case="'tech'">
        <path d="M3 15v-3a9 9 0 0 1 18 0v3"/>
        <rect x="3" y="14" width="4.5" height="7" rx="1.5"/>
        <rect x="16.5" y="14" width="4.5" height="7" rx="1.5"/>
    </th:block>
    <th:block th:case="'book'">
        <path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/>
        <path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/>
        <path d="M9 7h6"/>
    </th:block>
    <th:block th:case="'wear'">
        <path d="M8.5 3 3.5 6l2 4 2.5-1v12h8V9l2.5 1 2-4-5-3a3.5 3.5 0 0 1-7 0z"/>
    </th:block>
    <th:block th:case="'home'">
        <path d="M4 9h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/>
        <path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/>
        <path d="M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3"/>
    </th:block>
    <th:block th:case="*">
        <rect x="3" y="8" width="18" height="13" rx="1.5"/>
        <path d="M3 12.5h18M12 8v13"/>
        <path d="M12 8C10.5 4.5 6.5 4.5 6.5 6.5S9.5 8 12 8c2.5 0 5.5-.5 5.5-1.5S13.5 4.5 12 8z"/>
    </th:block>
</svg>

<!-- Gold star for "Top of the list" -->
<svg th:fragment="star" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/>
</svg>

<!-- Check mark -->
<svg th:fragment="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M5 12.5l4.5 4.5L19 7.5"/>
</svg>

<!-- Crossed-out eye: "reservations are hidden" -->
<svg th:fragment="eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 3l18 18"/>
    <path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6A17 17 0 0 0 2 12s4 7 10 7a9.6 9.6 0 0 0 4.4-1"/>
    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
</svg>

<!-- Link icon (share) -->
<svg th:fragment="link" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/>
    <path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>
</svg>

<!-- Arrow out (go to shop) -->
<svg th:fragment="external" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M7 17 17 7M8 7h9v9"/>
</svg>

<!-- Small gift. With a "?" for empty states, with a "+" for "new letter". -->
<svg th:fragment="gift(mark)" width="72" height="64" viewBox="420 76 80 46" aria-hidden="true">
    <rect class="gift" x="430" y="94" width="30" height="22" rx="2"/>
    <rect class="gift-lid" x="428" y="88" width="34" height="8" rx="1.5"/>
    <rect class="ribbon" x="443" y="88" width="4" height="28"/>
    <ellipse class="ribbon" cx="440" cy="85" rx="5.5" ry="3"/>
    <ellipse class="ribbon" cx="450" cy="85" rx="5.5" ry="3"/>
    <text th:if="${mark == '?'}" class="gift-q" x="472" y="112">?</text>
    <path th:if="${mark == '+'}" class="gift-plus" d="M474 96v14M467 103h14"/>
</svg>

</body>
</html>
