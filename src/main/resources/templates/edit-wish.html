<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Redigér ønske</title>
</head>
<body>
<main>
    <h1>Redigér ønske</h1>

    <form method="post"
          th:action="@{/wishlists/{wishlistId}/wishes/{wishId}/update(
              wishlistId=${wishlistId}, wishId=${wishId})}"
          th:object="${wish}">

        <ul th:if="${#fields.hasGlobalErrors()}" role="alert">
            <li th:each="error : ${#fields.globalErrors()}"
                th:text="${error}"></li>
        </ul>

        <div>
            <label for="title">Titel</label>
            <input type="text" id="title" th:field="*{title}" required>
            <p th:errors="*{title}"></p>
        </div>

        <div>
            <label for="description">Beskrivelse</label>
            <textarea id="description" th:field="*{description}"></textarea>
            <p th:errors="*{description}"></p>
        </div>

        <div>
            <label for="link">Produktlink</label>
            <input type="text" id="link" th:field="*{link}">
            <p th:errors="*{link}"></p>
        </div>

        <div>
            <label for="price">Pris</label>
            <input type="text" id="price" inputmode="decimal" th:field="*{price}">
            <p th:if="${#fields.hasErrors('price')}" role="alert">
                Indtast prisen som et tal.
            </p>
        </div>

        <button type="submit">Gem ændringer</button>
        <a th:href="@{/wishlists/{id}(id=${wishlistId})}">Annullér</a>
    </form>
</main>
</body>
</html>
